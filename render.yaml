services:
  - type: web
    name: life-rpg
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 15
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REDIS_CACHE_TTL_SECONDS
        value: "75"
      - key: REDIS_CACHE_TIMEOUT_MS
        value: "300"
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAILJET_FROM_EMAIL
        sync: false
      - key: MAILJET_FROM_NAME
        value: Life RPG
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
