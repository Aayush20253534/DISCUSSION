services:
  - type: web
    name: life-rpg
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 15
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAILJET_FROM_EMAIL
        sync: false
      - key: MAILJET_FROM_NAME
        value: Life RPG
